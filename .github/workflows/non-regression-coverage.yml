name: Non-Régression Coverage

# Workflow déclenché manuellement pour vérifier que les coverage_facts
# extraits par ingestion PDF correspondent aux valeurs de référence
# définies dans coverage_facts_control.
on:
  workflow_dispatch:
    inputs:
      insurer_code:
        description: 'Filtrer par code assureur (ex: MAAF01) — vide = tous'
        required: false
        default: ''
      insurance_type_code:
        description: 'Filtrer par code type assurance (ex: AUT01, HAB01, SAN01) — vide = tous'
        required: false
        default: ''

jobs:
  non-regression:
    name: Vérification de non-régression — Coverage Facts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BackEnd/package-lock.json

      - name: Install dependencies
        working-directory: BackEnd
        run: npm ci

      - name: Run non-regression control check
        working-directory: BackEnd
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.insurer_code }}" ]; then
            ARGS="$ARGS --insurer ${{ github.event.inputs.insurer_code }}"
          fi
          if [ -n "${{ github.event.inputs.insurance_type_code }}" ]; then
            ARGS="$ARGS --type ${{ github.event.inputs.insurance_type_code }}"
          fi
          npx ts-node src/scripts/run-control-check.ts $ARGS
        env:
          DB_HOST:     ${{ secrets.DB_HOST }}
          DB_PORT:     ${{ secrets.DB_PORT }}
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL:      ${{ secrets.DB_SSL }}

      - name: Upload rapport JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-control-report-${{ github.run_id }}
          path: BackEnd/reports/control-check-*.json
          retention-days: 30
          if-no-files-found: warn
