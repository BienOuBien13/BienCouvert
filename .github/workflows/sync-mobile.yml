name: 🔄 Sync Mobile & Build Expo

on:
  push:
    branches: [main]
    paths:
      # Déclenchement si FrontEnd ou BackEnd est modifié
      - 'FrontEnd/**'
      - 'BackEnd/**'
      - 'BienCouvert/**'
      - 'scripts/sync-mobile.js'

  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Profil EAS Build'
        required: true
        default: 'preview'
        type: choice
        options: [development, preview, production]
      force_build:
        description: 'Forcer le build même sans changement mobile'
        required: false
        default: false
        type: boolean

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 : Synchronisation des fichiers partagés
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  sync-shared-files:
    name: 🔃 Sync FrontEnd → BienCouvert
    runs-on: ubuntu-latest
    outputs:
      mobile_changed: ${{ steps.detect.outputs.mobile_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      backend_changed: ${{ steps.detect.outputs.backend_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Pour pouvoir comparer avec le commit précédent

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BienCouvert/package-lock.json

      # ── Détecter quels dossiers ont changé ──────────────────────────────────
      - name: Detect changed paths
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # FrontEnd modifié ?
          if echo "$CHANGED" | grep -q "^FrontEnd/"; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "✅ FrontEnd modifié"
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
          fi

          # BackEnd modifié ?
          if echo "$CHANGED" | grep -q "^BackEnd/"; then
            echo "backend_changed=true" >> $GITHUB_OUTPUT
            echo "✅ BackEnd modifié"
          else
            echo "backend_changed=false" >> $GITHUB_OUTPUT
          fi

          # BienCouvert modifié ?
          if echo "$CHANGED" | grep -q "^BienCouvert/"; then
            echo "mobile_changed=true" >> $GITHUB_OUTPUT
            echo "✅ BienCouvert modifié"
          else
            echo "mobile_changed=false" >> $GITHUB_OUTPUT
          fi

      # ── Sync des fichiers partagés si FrontEnd a changé ─────────────────────
      - name: Run sync-mobile script
        if: steps.detect.outputs.frontend_changed == 'true'
        run: node scripts/sync-mobile.js

      # ── Commiter les fichiers synchronisés si des changements ont eu lieu ───
      - name: Commit synced files
        if: steps.detect.outputs.frontend_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add BienCouvert/types/ BienCouvert/utils/uuid.ts
          if git diff --cached --quiet; then
            echo "Rien à commiter après sync"
          else
            git commit -m "chore(mobile): sync shared types from FrontEnd [skip ci]"
            git push
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 : Typecheck du projet Expo
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck-mobile:
    name: 🔍 TypeCheck BienCouvert
    runs-on: ubuntu-latest
    needs: sync-shared-files
    if: >
      needs.sync-shared-files.outputs.mobile_changed == 'true' ||
      needs.sync-shared-files.outputs.frontend_changed == 'true' ||
      github.event.inputs.force_build == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BienCouvert/package-lock.json

      - name: Install dependencies
        working-directory: BienCouvert
        run: npm ci

      - name: TypeScript check
        working-directory: BienCouvert
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3 : EAS Build (preview ou production)
  # Déclenché uniquement sur workflow_dispatch ou si BienCouvert a changé en
  # production (branch main + tag vX.X.X)
  # ─────────────────────────────────────────────────────────────────────────────
  eas-build:
    name: 📦 EAS Build Android
    runs-on: ubuntu-latest
    needs: typecheck-mobile
    # Lancer le build uniquement si déclenché manuellement
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BienCouvert/package-lock.json

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: BienCouvert
        run: npm ci

      - name: EAS Build
        working-directory: BienCouvert
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.build_profile || 'preview' }}"
          echo "🚀 Lancement du build EAS avec le profil: $PROFILE"
          eas build --platform android --profile $PROFILE --non-interactive

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4 : EAS Update (OTA) — pour les mises à jour JS uniquement
  # Se déclenche automatiquement si BienCouvert ou FrontEnd a changé
  # et que le build natif n'a PAS changé (pas de nouveau package natif)
  # ─────────────────────────────────────────────────────────────────────────────
  eas-update:
    name: ⚡ EAS Update (OTA)
    runs-on: ubuntu-latest
    needs: typecheck-mobile
    # Uniquement sur main, pas sur workflow_dispatch (qui utilise EAS Build)
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.sync-shared-files.outputs.mobile_changed == 'true' ||
        needs.sync-shared-files.outputs.frontend_changed == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BienCouvert/package-lock.json

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        working-directory: BienCouvert
        run: npm ci

      - name: Generate update message
        id: msg
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          # Détecter l'origine du changement
          CHANGED="${{ needs.sync-shared-files.outputs.frontend_changed == 'true' && 'FrontEnd' || 'Mobile' }}"
          echo "message=[${CHANGED}] ${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: EAS Update (OTA push)
        working-directory: BienCouvert
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch production \
            --message "${{ steps.msg.outputs.message }}" \
            --non-interactive
