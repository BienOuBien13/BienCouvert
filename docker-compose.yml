version: '3.8'

services:
  # Backend Node.js + Express + PostgreSQL
  backend:
    container_name: assurclair-backend
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    env_file:
      - ./BackEnd/.env.production   # Config publique (commité, sans secrets)
      - ./BackEnd/.env              # Secrets sur la VM (gitignore, surcharge .env.production)
    environment:
      - REDIS_URL=redis://redis:6379  # Cache IA (container Redis interne)
    ports:
      - "4000:4000"
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis — cache réponses IA/RAG (TTL 30 min, ~50MB max)
  redis:
    container_name: assurclair-redis
    image: redis:7-alpine
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru --save ""
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend React + Nginx
  frontend:
    container_name: assurclair-frontend
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: assurclair-network
