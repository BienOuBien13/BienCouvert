version: '3.8'

services:
  # Backend Node.js + Express + PostgreSQL
  backend:
    container_name: assurclair-backend
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - POSTGRES_HOST=52.143.159.51
      - POSTGRES_PORT=5432
      - POSTGRES_DB=assurclair
      - POSTGRES_USER=remijolivalt
      - POSTGRES_PASSWORD=Remi1982
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - CSRF_SECRET=${CSRF_SECRET:-csrf-secret-change-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FRONTEND_ORIGIN=https://biencouvert.fr,https://www.biencouvert.fr,http://localhost:3000,https://52.143.159.51,http://52.143.159.51,http://52.143.159.51:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React + Nginx
  frontend:
    container_name: assurclair-frontend
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: assurclair-network
