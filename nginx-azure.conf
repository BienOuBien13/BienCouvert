# Configuration Nginx pour VM Azure
# À copier dans /etc/nginx/conf.d/assurclair.conf sur la VM
#
# NOTE : Ce fichier gère le port 80 (HTTP) et le domaine biencouvert.fr.
#        Certbot y ajoute automatiquement un bloc 443 (HTTPS) lors de l'init.
#        Si certbot est configuré, les requêtes HTTP sont redirigées vers HTTPS.

# ── Redirection HTTP → HTTPS pour biencouvert.fr / www.biencouvert.fr ────────
# Ce bloc sera conservé même après que certbot ait ajouté le bloc 443 en dessous.
server {
    listen 80;
    server_name biencouvert.fr www.biencouvert.fr;

    # Certbot challenge (renouvellement automatique Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection permanente vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Accès direct par IP (health checks internes / monitoring) ─────────────────
server {
    listen 80;
    server_name 52.143.159.51;

    # Frontend statique (build Vite)
    root /var/www/assurclair/frontend;
    index index.html;

    # Logs
    access_log /var/log/nginx/assurclair-access.log;
    error_log /var/log/nginx/assurclair-error.log;

    client_max_body_size 50M;

    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ── Bloc HTTPS principal (biencouvert.fr) ─────────────────────────────────────
# Certbot peuple les chemins de certificats automatiquement.
# Si certbot n'est pas encore configuré, commenter ce bloc et lancer :
#   sudo certbot --nginx -d biencouvert.fr -d www.biencouvert.fr
server {
    listen 443 ssl;
    server_name biencouvert.fr www.biencouvert.fr;

    # ── Certificats Let's Encrypt (remplis par certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/biencouvert.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biencouvert.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Headers sécurité ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/assurclair-access.log;
    error_log  /var/log/nginx/assurclair-error.log;

    client_max_body_size 50M;

    # ── API Backend ───────────────────────────────────────────────────────────
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 75s;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    root /var/www/assurclair/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
