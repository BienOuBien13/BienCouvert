# Configuration Nginx pour VM Azure (port 80)
# À copier dans /etc/nginx/conf.d/assurclair.conf sur la VM

server {
    listen 80;
    server_name 52.143.159.51;

    # Frontend statique (build Vite)
    root /var/www/assurclair/frontend;
    index index.html;

    # Logs
    access_log /var/log/nginx/assurclair-access.log;
    error_log /var/log/nginx/assurclair-error.log;

    # Limite de taille des requêtes (pour upload de PDFs en base64)
    client_max_body_size 50M;

    # API Backend (reverse proxy vers Express:4000)
    location /api/ {
        proxy_pass http://localhost:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout pour les appels Gemini (peuvent être longs)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Frontend SPA - Router côté client
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité - Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
